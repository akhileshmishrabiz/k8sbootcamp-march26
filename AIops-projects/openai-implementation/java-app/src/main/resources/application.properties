# Server Configuration
server.port=8080
spring.application.name=failure-app

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres-service}:5432/${DB_NAME:failuredb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.failureapp=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.paymentGateway.register-health-indicator=true
resilience4j.circuitbreaker.instances.paymentGateway.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentGateway.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.paymentGateway.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.paymentGateway.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentGateway.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentGateway.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.paymentGateway.slow-call-rate-threshold=50

# Resilience4j Retry Configuration
resilience4j.retry.instances.paymentRetry.max-attempts=3
resilience4j.retry.instances.paymentRetry.wait-duration=500ms
resilience4j.retry.instances.paymentRetry.retry-exceptions=java.lang.RuntimeException

# Resilience4j Rate Limiter Configuration
resilience4j.ratelimiter.instances.orderRateLimiter.limit-for-period=10
resilience4j.ratelimiter.instances.orderRateLimiter.limit-refresh-period=1s
resilience4j.ratelimiter.instances.orderRateLimiter.timeout-duration=0s

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=600s

# Secrets (from Kubernetes Secret: app-secrets)
payment.gateway.api.key=${PAYMENT_GATEWAY_API_KEY:}
stripe.secret.key=${STRIPE_SECRET_KEY:}
jwt.secret=${JWT_SECRET:}
encryption.key=${ENCRYPTION_KEY:}
sendgrid.api.key=${SENDGRID_API_KEY:}
aws.access.key=${AWS_ACCESS_KEY:}
aws.secret.key=${AWS_SECRET_KEY:}
oauth.client.secret=${OAUTH_CLIENT_SECRET:}
redis.password=${REDIS_PASSWORD:}

# ConfigMap values (from Kubernetes ConfigMap: app-config)
app.name=${APP_NAME:Failure App}
app.version=${APP_VERSION:1.0.0}
app.environment=${APP_ENVIRONMENT:development}

# Feature flags
feature.payment.enabled=${FEATURE_PAYMENT_ENABLED:false}
feature.notifications.enabled=${FEATURE_NOTIFICATIONS_ENABLED:false}
feature.analytics.enabled=${FEATURE_ANALYTICS_ENABLED:false}
feature.cache.enabled=${FEATURE_CACHE_ENABLED:true}
feature.ratelimit.enabled=${FEATURE_RATELIMIT_ENABLED:true}

# External service URLs
payment.gateway.url=${PAYMENT_GATEWAY_URL:}
notification.service.url=${NOTIFICATION_SERVICE_URL:}
analytics.service.url=${ANALYTICS_SERVICE_URL:}

# Timeouts
http.connect.timeout=${HTTP_CONNECT_TIMEOUT:5000}
http.read.timeout=${HTTP_READ_TIMEOUT:30000}
database.query.timeout=${DATABASE_QUERY_TIMEOUT:10000}
cache.ttl.seconds=${CACHE_TTL_SECONDS:3600}

# Connection pools (override HikariCP settings from ConfigMap)
database.pool.size=${DATABASE_POOL_SIZE:20}
database.pool.max.wait.ms=${DATABASE_POOL_MAX_WAIT_MS:30000}
redis.pool.max.connections=${REDIS_POOL_MAX_CONNECTIONS:50}

# Rate limiting
ratelimit.requests.per.minute=${RATELIMIT_REQUESTS_PER_MINUTE:100}
ratelimit.burst.size=${RATELIMIT_BURST_SIZE:20}

# Circuit breaker (override resilience4j settings)
circuit.breaker.failure.threshold=${CIRCUIT_BREAKER_FAILURE_THRESHOLD:50}
circuit.breaker.timeout.seconds=${CIRCUIT_BREAKER_TIMEOUT_SECONDS:10}
circuit.breaker.half.open.requests=${CIRCUIT_BREAKER_HALF_OPEN_REQUESTS:3}

# Retry policy
retry.max.attempts=${RETRY_MAX_ATTEMPTS:3}
retry.backoff.ms=${RETRY_BACKOFF_MS:500}

# Business logic
order.processing.timeout.seconds=${ORDER_PROCESSING_TIMEOUT_SECONDS:60}
payment.processing.timeout.seconds=${PAYMENT_PROCESSING_TIMEOUT_SECONDS:45}
inventory.reservation.timeout.seconds=${INVENTORY_RESERVATION_TIMEOUT_SECONDS:30}
max.order.items=${MAX_ORDER_ITEMS:50}
max.order.value=${MAX_ORDER_VALUE:10000.00}
