apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: openai-monitor
data:
  # Application configuration
  app.name: "Failure Monitoring App"
  app.version: "2.0.0"
  app.environment: "production"

  # Feature flags
  feature.payment.enabled: "true"
  feature.notifications.enabled: "true"
  feature.analytics.enabled: "false"
  feature.cache.enabled: "true"
  feature.ratelimit.enabled: "true"

  # External service URLs
  payment.gateway.url: "https://api.stripe.com/v1"
  notification.service.url: "https://api.sendgrid.com/v3"
  analytics.service.url: "https://analytics.example.com/api"

  # Timeouts (in milliseconds)
  http.connect.timeout: "5000"
  http.read.timeout: "30000"
  database.query.timeout: "10000"
  cache.ttl.seconds: "3600"

  # Connection pool settings
  database.pool.size: "20"
  database.pool.max.wait.ms: "30000"
  redis.pool.max.connections: "50"

  # Rate limiting
  ratelimit.requests.per.minute: "100"
  ratelimit.burst.size: "20"

  # Circuit breaker settings
  circuit.breaker.failure.threshold: "50"
  circuit.breaker.timeout.seconds: "10"
  circuit.breaker.half.open.requests: "3"

  # Retry policy
  retry.max.attempts: "3"
  retry.backoff.ms: "500"

  # Monitoring and health
  health.check.interval.seconds: "30"
  metrics.enabled: "true"
  logging.level: "INFO"

  # Business logic settings
  order.processing.timeout.seconds: "60"
  payment.processing.timeout.seconds: "45"
  inventory.reservation.timeout.seconds: "30"
  max.order.items: "50"
  max.order.value: "10000.00"
