# kind cluster for the Failure Monitoring POC.
# Maps dashboard NodePort 30001 to localhost:30001 on the host.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: failure-monitoring
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
