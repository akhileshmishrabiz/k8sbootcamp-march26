{{- if .Values.ragApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: {{ include "rag-system.namespace" . }}
  labels:
    app: rag-api
    {{- include "rag-system.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-api
  template:
    metadata:
      labels:
        app: rag-api
    spec:
      containers:
        - name: rag-api
          image: {{ .Values.ragApi.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.ragApi.port }}
          env:
            - name: OLLAMA_URL
              value: http://ollama:11434
            - name: QDRANT_URL
              value: http://qdrant:6333
            - name: EMBED_MODEL
              value: {{ .Values.ragApi.embedModel | quote }}
            - name: LLM_MODEL
              value: {{ .Values.ragApi.llmModel | quote }}
            - name: CHUNK_SIZE
              value: {{ .Values.ragApi.chunkSize | quote }}
            - name: CHUNK_OVERLAP
              value: {{ .Values.ragApi.chunkOverlap | quote }}
            - name: TOP_K
              value: {{ .Values.ragApi.topK | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.ragApi.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.ragApi.port }}
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.ragApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: {{ include "rag-system.namespace" . }}
  labels:
    app: rag-api
spec:
  selector:
    app: rag-api
  ports:
    - port: {{ .Values.ragApi.port }}
      targetPort: {{ .Values.ragApi.port }}
{{- end }}
