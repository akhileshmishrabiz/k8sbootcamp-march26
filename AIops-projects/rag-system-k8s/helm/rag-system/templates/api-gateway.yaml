{{- if .Values.apiGateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: {{ include "rag-system.namespace" . }}
  labels:
    {{- include "rag-system.labels" . | nindent 4 }}
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        upstream rag_api {
            server rag-api.{{ include "rag-system.namespace" . }}.svc.cluster.local:{{ .Values.ragApi.port }};
        }
        upstream rag_frontend {
            server rag-frontend.{{ include "rag-system.namespace" . }}.svc.cluster.local:80;
        }

        server {
            listen 80;
            server_name localhost;
            client_max_body_size 20m;

            location /api/ {
                proxy_pass http://rag_api;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_read_timeout 600s;
                proxy_connect_timeout 30s;
                proxy_send_timeout 600s;
            }

            location /health {
                proxy_pass http://rag_api/health;
            }

            location / {
                proxy_pass http://rag_frontend;
                proxy_set_header Host $host;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ include "rag-system.namespace" . }}
  labels:
    app: api-gateway
    {{- include "rag-system.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: nginx
          image: {{ .Values.apiGateway.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: api-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ include "rag-system.namespace" . }}
  labels:
    app: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: {{ .Values.apiGateway.nodePort }}
{{- end }}
