{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  namespace: {{ include "rag-system.namespace" . }}
  labels:
    app: rag-frontend
    {{- include "rag-system.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-frontend
  template:
    metadata:
      labels:
        app: rag-frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: rag-frontend
  namespace: {{ include "rag-system.namespace" . }}
  labels:
    app: rag-frontend
spec:
  selector:
    app: rag-frontend
  ports:
    - port: 80
      targetPort: 80
{{- end }}
